name: Localize Expo Site

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/localize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download exact site assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build assets/packs docs fonts images __sitecloner

          fetch() {
            local url="$1"
            local output="$2"
            echo "Fetching $output"
            curl --fail --location --silent --show-error               --retry 4 --retry-delay 2               --user-agent "Mozilla/5.0"               "$url" -o "$output"
            test -s "$output"
          }

          fetch "https://expo.dmlainfo.fr/" "index.html"
          fetch "https://expo.dmlainfo.fr/manifest.json" "manifest.json"
          fetch "https://expo.dmlainfo.fr/build/main.js?h=1613-1009" "build/main.js"
          fetch "https://expo.dmlainfo.fr/assets/packs/webgl.pack?h=1613-1009" "assets/packs/webgl.pack"
          fetch "https://expo.dmlainfo.fr/assets/packs/audio.pack?h=1613-1009" "assets/packs/audio.pack"
          fetch "https://expo.dmlainfo.fr/assets/packs/photos.pack?h=1613-1009" "assets/packs/photos.pack"
          fetch "https://expo.dmlainfo.fr/fonts/Inter.ttf" "fonts/Inter.ttf"
          fetch "https://expo.dmlainfo.fr/images/logo_retina_france.png" "images/logo_retina_france.png"
          fetch "https://expo.dmlainfo.fr/images/logo_novartis.png" "images/logo_novartis.png"
          fetch "https://expo.dmlainfo.fr/images/logo_association_dmla.png" "images/logo_association_dmla.png"
          fetch "https://expo.dmlainfo.fr/images/apple-touch-icon.png" "images/apple-touch-icon.png"
          fetch "https://expo.dmlainfo.fr/images/google-touch-icon.png" "images/google-touch-icon.png"
          fetch "https://expo.dmlainfo.fr/images/favicon.svg" "images/favicon.svg"
          fetch "https://expo.dmlainfo.fr/images/mask-icon.svg" "images/mask-icon.svg"
          fetch "https://expo.dmlainfo.fr/docs/cgu.pdf" "docs/cgu.pdf"
          fetch "https://expo.dmlainfo.fr/docs/cookies.pdf" "docs/cookies.pdf"

          curl --fail --location --silent --show-error             --retry 2 --retry-delay 2             --user-agent "Mozilla/5.0"             "https://expo.dmlainfo.fr/images/share.png"             -o "images/share.png" || rm -f "images/share.png"

      - name: Verify captured asset hashes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expo.sha256 <<'HASHES'
          01bce45f41fa3be4e085f60ff645fef64b1a94771b7e13090b724f05d3bec1f7  manifest.json
          9261b1f98c165cff8f02175e9c8431afff6be852533b93fbaebbfe9ea4cdf68e  build/main.js
          0b5d36077654d60e6fffcbab341bc52c0a94040ccfb3c538ef8eac5862c3370c  assets/packs/webgl.pack
          1b5d578aea921321d9b3e416347efdab33d22bc85614d2e1c4ae71c6ff7912a3  assets/packs/audio.pack
          4148b5b7f0e462e31c9c0aec8aaa509f351a4cf44d66e02ae56d9890bbd7a1af  assets/packs/photos.pack
          2bc548145fb72b0ed4a918a222978e279bee02fb9a1f7dee50de242e9b6e2497  fonts/Inter.ttf
          47f32bcfee601db69c8cc8c58a75c9b8e96eb76ad2c46ae30da7aa9a5a9b5ec4  images/logo_retina_france.png
          dc3927027d20ac4211367de00ead7892662cf060615daa5ffc407999638a175b  images/logo_novartis.png
          a4351c684967bc7f0cb625234b8d2ea69bb47d6c38e2e114d5111a2c98ee8f4c  images/logo_association_dmla.png
          920ea740b90b6e04893779669cd50ea61b28a425dbf53569366024470b3ed220  images/apple-touch-icon.png
          91e35b35521c4ee003711e9d47c76c8e32a37b8190f171688ec2028f407a86f6  images/google-touch-icon.png
          187fddf4bc42925ba5723cb85305609b98229f91bdb75dce9afa47ac173c29f5  images/favicon.svg
          b4eabbccbd296848b67e69fb6f2c6390c0293afc73267f13f6998614f59fc582  images/mask-icon.svg
          8ea0388cbc1b85539514bd9e8fe230aa677d692b3236e9dba8f8604fe9171ade  docs/cgu.pdf
          b3db6522fed62e14462aa84e4ef74203f21e9e767e8ad0aece258db2b7d7bc6b  docs/cookies.pdf
          HASHES
          sha256sum --check /tmp/expo.sha256

      - name: Make runtime fully local
        shell: bash
        run: |
          set -euo pipefail

          cat > __sitecloner/runtime.js <<'JS'
          (() => {
            const BLOCKED = '/__sitecloner/blocked';

            const localize = value => {
              try {
                const raw = String(value && value.url ? value.url : value);
                if (!raw || raw.startsWith('data:') || raw.startsWith('blob:') || raw.startsWith('about:')) return raw;

                const url = new URL(raw, location.href);
                if (url.origin === location.origin) return raw;

                if (['http:', 'https:', 'ws:', 'wss:'].includes(url.protocol)) return BLOCKED;
                return raw;
              } catch {
                return BLOCKED;
              }
            };

            const originalFetch = window.fetch;
            if (originalFetch) {
              window.fetch = (input, init) => originalFetch.call(window, localize(input), init);
            }

            const originalXhrOpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function(method, url, ...rest) {
              return originalXhrOpen.call(this, method, localize(url), ...rest);
            };

            try {
              const OriginalWorker = window.Worker;
              if (OriginalWorker) {
                window.Worker = function(url, options) {
                  return new OriginalWorker(localize(url), options);
                };
              }
            } catch {}

            try {
              const OriginalWebSocket = window.WebSocket;
              if (OriginalWebSocket) {
                window.WebSocket = function(url, protocols) {
                  const mapped = localize(url);
                  if (mapped === BLOCKED) {
                    throw new DOMException('External network access is disabled', 'SecurityError');
                  }
                  return new OriginalWebSocket(mapped, protocols);
                };
              }
            } catch {}

            try {
              const beacon = navigator.sendBeacon && navigator.sendBeacon.bind(navigator);
              if (beacon) {
                navigator.sendBeacon = (url, data) => {
                  const mapped = localize(url);
                  return mapped === BLOCKED ? false : beacon(mapped, data);
                };
              }
            } catch {}

            try {
              const originalWindowOpen = window.open.bind(window);
              window.open = (url, ...args) => {
                const mapped = localize(url);
                return mapped === BLOCKED ? null : originalWindowOpen(mapped, ...args);
              };
            } catch {}

            for (const [Ctor, prop] of [
              [HTMLImageElement, 'src'],
              [HTMLScriptElement, 'src'],
              [HTMLLinkElement, 'href'],
              [HTMLVideoElement, 'src'],
              [HTMLAudioElement, 'src'],
              [HTMLSourceElement, 'src'],
              [HTMLIFrameElement, 'src']
            ]) {
              try {
                const descriptor = Object.getOwnPropertyDescriptor(Ctor.prototype, prop);
                if (descriptor && descriptor.set) {
                  Object.defineProperty(Ctor.prototype, prop, {
                    ...descriptor,
                    set(value) {
                      return descriptor.set.call(this, localize(value));
                    }
                  });
                }
              } catch {}
            }

            const originalSetAttribute = Element.prototype.setAttribute;
            Element.prototype.setAttribute = function(name, value) {
              if (['src', 'href', 'data', 'action'].includes(String(name).toLowerCase())) {
                value = localize(value);
              }
              return originalSetAttribute.call(this, name, value);
            };
          })();
          JS

          printf '%s
' 'External runtime request blocked intentionally.' > __sitecloner/blocked

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          csp = (
              '<meta http-equiv="Content-Security-Policy" '
              'content="default-src \'self\' data: blob:; '
              'script-src \'self\' \'unsafe-inline\' \'unsafe-eval\' blob:; '
              'style-src \'self\' \'unsafe-inline\' data: blob:; '
              'img-src \'self\' data: blob:; '
              'font-src \'self\' data: blob:; '
              'media-src \'self\' data: blob:; '
              'connect-src \'self\' data: blob:; '
              'worker-src \'self\' blob:; '
              'child-src \'self\' blob:; '
              'frame-src \'self\' about: blob:; '
              'object-src \'self\' data: blob:; '
              'form-action \'self\'; base-uri \'self\'">'
              '<script src="/__sitecloner/runtime.js"></script>'
          )

          if "/__sitecloner/runtime.js" not in html:
              html = html.replace("<head>", "<head>" + csp, 1)

          html = re.sub(r'window\.gaID="[^"]*"', 'window.gaID=""', html, count=1)
          html = re.sub(
              r'window\.formAPIUrl="[^"]*"',
              'window.formAPIUrl="/__sitecloner/blocked"',
              html,
              count=1
          )

          if not Path("images/share.png").exists():
              html = re.sub(r'<meta property="og:image"[^>]*>', '', html)
              html = re.sub(r'<meta name="twitter:image"[^>]*>', '', html)

          path.write_text(html, encoding="utf-8")
          PY

          cat > vercel.json <<'JSON'
          {
            "cleanUrls": false,
            "headers": [
              {
                "source": "/assets/packs/(.*)",
                "headers": [
                  {
                    "key": "Content-Type",
                    "value": "application/octet-stream"
                  },
                  {
                    "key": "Cache-Control",
                    "value": "public, max-age=31536000, immutable"
                  }
                ]
              },
              {
                "source": "/build/(.*)",
                "headers": [
                  {
                    "key": "Cache-Control",
                    "value": "public, max-age=31536000, immutable"
                  }
                ]
              }
            ]
          }
          JSON

      - name: Audit local production paths
        shell: bash
        run: |
          set -euo pipefail

          test -s index.html
          test -s build/main.js
          test -s assets/packs/webgl.pack
          test -s assets/packs/audio.pack
          test -s assets/packs/photos.pack
          test -s fonts/Inter.ttf
          test -s docs/cgu.pdf
          test -s docs/cookies.pdf

          if grep -RIn "expo\.dmlainfo\.fr"             index.html build assets docs fonts images __sitecloner manifest.json vercel.json; then
            echo "Found a live source-domain reference in production files."
            exit 1
          fi

          grep -q '/build/main.js' index.html
          grep -q 'window.formAPIUrl="/__sitecloner/blocked"' index.html

      - name: Commit localized site
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html manifest.json build assets docs fonts images __sitecloner vercel.json

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Localize Expo site assets [skip ci]"
          git push
