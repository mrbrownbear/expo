name: Localize Expo Site

on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/localize.sh"
      - ".github/workflows/localize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Localize and verify site
        run: bash .github/scripts/localize.sh
